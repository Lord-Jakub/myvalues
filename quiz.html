<h2 style="text-align:center;" id="question-number">Loading...</h2>
<p class="question" id="question-text"></p>
<button class="button stronglyAgree" onclick="next_question( 1.0)">Strongly Agree</button> <br>
<button class="button agree" onclick="next_question( 0.5)">Agree</button> <br>
<button class="button neutral" onclick="next_question( 0.0)">Neutral/Unsure</button> <br>
<button class="button disagree" onclick="next_question(-0.5)">Disagree</button> <br>
<button class="button stronglyDisagree" onclick="next_question(-1.0)">Strongly Disagree</button> <br>
<button class="small_button" onclick="prev_question()" id="back_button">Back</button>
<button class="small_button_off" id="back_button_off">Back</button><br>

<!-- JavaScript for the test itself -->
<script>
    var max_econ, max_nati, max_govt, max_scty, max_mltr, max_trde, max_tech, max_demc, max_imig, max_radi, max_reli;// Max possible scores
    max_econ = max_nati = max_govt = max_scty = max_mltr = max_trde = max_tech = max_demc = max_imig = max_radi = max_reli = 0;
    let econ_array = new Array(questions.length);
    let nati_array = new Array(questions.length);
    let govt_array = new Array(questions.length);
    let scty_array = new Array(questions.length);
    let mltr_array = new Array(questions.length);
    let trde_array = new Array(questions.length);
    let tech_array = new Array(questions.length);
    let demc_array = new Array(questions.length);
    let imig_array = new Array(questions.length);
    let radi_array = new Array(questions.length);
    let reli_array = new Array(questions.length);
    var qn = 0; // Question number
    //randomise the order of the questions
    questions.sort(function() { return Math.random() - 0.5; });
    init_question();
    for (var i = 0; i < questions.length; i++) {
        max_econ += Math.abs(questions[i].effect.econ)
        max_nati += Math.abs(questions[i].effect.nati)
        max_govt += Math.abs(questions[i].effect.govt)
        max_scty += Math.abs(questions[i].effect.scty)
        max_mltr += Math.abs(questions[i].effect.mltr)
        max_trde += Math.abs(questions[i].effect.trde)
        max_tech += Math.abs(questions[i].effect.tech)
        max_demc += Math.abs(questions[i].effect.demc)
        max_imig += Math.abs(questions[i].effect.imig)
        max_radi += Math.abs(questions[i].effect.radi)
        max_reli += Math.abs(questions[i].effect.reli)
    }
    function init_question() {
        document.getElementById("question-text").innerHTML = questions[qn].question;
        document.getElementById("question-number").innerHTML = "Question " + (qn + 1) + " of " + (questions.length);
        if (qn == 0) {
            document.getElementById("back_button").style.display = 'none';
            document.getElementById("back_button_off").style.display = 'block';
        } else {
            document.getElementById("back_button").style.display = 'block';
            document.getElementById("back_button_off").style.display = 'none';
        }

    }

    function next_question(mult) {
        econ_array[qn] = mult*questions[qn].effect.econ
        nati_array[qn] = mult*questions[qn].effect.nati
        govt_array[qn] = mult*questions[qn].effect.govt
        scty_array[qn] = mult*questions[qn].effect.scty
        mltr_array[qn] = mult*questions[qn].effect.mltr
        trde_array[qn] = mult*questions[qn].effect.trde
        tech_array[qn] = mult*questions[qn].effect.tech
        demc_array[qn] = mult*questions[qn].effect.demc
        imig_array[qn] = mult*questions[qn].effect.imig
        radi_array[qn] = mult*questions[qn].effect.radi
        reli_array[qn] = mult*questions[qn].effect.reli
        qn++;
        if (qn < questions.length) {
            init_question();
        } else {
            results();
        }
    }

    function prev_question() {
        if (qn == 0) {
            return;
        }
        qn--;
        init_question();
    }

    function calc_score(score,max) {
        return (100*(max+score)/(2*max)).toFixed(1)
    }

    function results() {
        let final_econ = econ_array.reduce((a, b) => a + b, 0)
        let final_nati = nati_array.reduce((a, b) => a + b, 0)
        let final_govt = govt_array.reduce((a, b) => a + b, 0)
        let final_scty = scty_array.reduce((a, b) => a + b, 0)
        let final_mltr = mltr_array.reduce((a, b) => a + b, 0)
        let final_trde = trde_array.reduce((a, b) => a + b, 0)
        let final_tech = tech_array.reduce((a, b) => a + b, 0)
        let final_demc = demc_array.reduce((a, b) => a + b, 0)
        let final_imig = imig_array.reduce((a, b) => a + b, 0)
        let final_radi = radi_array.reduce((a, b) => a + b, 0)
        let final_reli = reli_array.reduce((a, b) => a + b, 0)
        location.href = `results.html`
            + `?econ=${calc_score(final_econ,max_econ)}`
            + `&nati=${calc_score(final_nati,max_nati)}`
            + `&govt=${calc_score(final_govt,max_govt)}`
            + `&scty=${calc_score(final_scty,max_scty)}`
            + `&mltr=${calc_score(final_mltr,max_mltr)}`
            + `&trde=${calc_score(final_trde,max_trde)}`
            + `&tech=${calc_score(final_tech,max_tech)}`
            + `&demc=${calc_score(final_demc,max_demc)}`
            + `&imig=${calc_score(final_imig,max_imig)}`
            + `&radi=${calc_score(final_radi,max_radi)}`
            + `&reli=${calc_score(final_reli,max_reli)}`
            

    }
</script>
</body>
